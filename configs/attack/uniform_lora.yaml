attack_family: uniform
attack_types:
  - sampled
  - distributional
attack_learning_rates:
  low: 1.0e-5
  medium: 3.0e-5
  strong_optional: 1.0e-4
attack_steps:
  - 0
  - 10
  - 50
  - 100
  - 250
  - 500
  - 1000
  - 2500
  - 5000
extended_attack_steps:
  - 10000
  - 20000
default_attack_type: distributional
default_attack_lr: 3.0e-5
checkpoint_path_template: "results/attack/{condition}/seed_{seed}/{attack_type}/lr_{attack_lr}/difficulty_{difficulty_level}/attack_step_{attack_step}"
collapse_thresholds:
  sigma_rel_error: 0.50
  entropy_ratio: 0.70
