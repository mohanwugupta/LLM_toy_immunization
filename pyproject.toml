[project]
name = "real_llm_immunization"
version = "0.1.0"
description = "Real-LLM Numerical Representational Immunization Benchmark"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers",
    "peft",
    "numpy",
    "pytest",
    "pyyaml",
    "scikit-learn"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
